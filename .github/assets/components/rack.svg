      <rect x="136" y="26" width="10" height="228" fill="#4b5467"/><rect x="136" y="27" width="10" height="2" fill="#a3acba"/><rect x="139.5" y="35" width="3" height="3" fill="#0d1015"/><rect x="139.5" y="45" width="3" height="3" fill="#0d1015"/><rect x="139.5" y="55" width="3" height="3" fill="#0d1015"/><rect x="136" y="67" width="10" height="2" fill="#a3acba"/><rect x="139.5" y="75" width="3" height="3" fill="#0d1015"/><rect x="139.5" y="85" width="3" height="3" fill="#0d1015"/><rect x="139.5" y="95" width="3" height="3" fill="#0d1015"/><rect x="136" y="107" width="10" height="2" fill="#a3acba"/><rect x="139.5" y="115" width="3" height="3" fill="#0d1015"/><rect x="139.5" y="125" width="3" height="3" fill="#0d1015"/><rect x="139.5" y="135" width="3" height="3" fill="#0d1015"/><rect x="136" y="147" width="10" height="2" fill="#a3acba"/><rect x="139.5" y="155" width="3" height="3" fill="#0d1015"/><rect x="139.5" y="165" width="3" height="3" fill="#0d1015"/><rect x="139.5" y="175" width="3" height="3" fill="#0d1015"/><rect x="136" y="187" width="10" height="2" fill="#a3acba"/><rect x="139.5" y="195" width="3" height="3" fill="#0d1015"/><rect x="139.5" y="205" width="3" height="3" fill="#0d1015"/><rect x="139.5" y="215" width="3" height="3" fill="#0d1015"/>
      <rect x="28" y="26" width="104" height="228" fill="url(#perforation)"/>
      <rect x="122" y="118" width="7" height="44" rx="3" fill="#3b4352" stroke="#4b5467"/>
