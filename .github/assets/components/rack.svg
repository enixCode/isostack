      <rect transform="matrix(1 0 0 1 154 22)" width="32" height="132" fill="url(#shadow-edge)"/><rect transform="matrix(0 1 1 0 22 154)" width="32" height="132" fill="url(#shadow-edge)"/><rect transform="matrix(1 0 0 1 154 154)" width="32" height="32" fill="url(#shadow-corner)"/><rect transform="matrix(-1 0 0 1 22 154)" width="32" height="32" fill="url(#shadow-corner)"/><rect transform="matrix(1 0 0 -1 154 22)" width="32" height="32" fill="url(#shadow-corner)"/>
    </g>
    <g class="cover">
      <g transform="matrix(.866 .5 -.866 .5 0 -280)">
      <rect width="160" height="160" fill="#3b4352"/>
      <rect x="4" y="4" width="152" height="152" rx="3" fill="none" stroke="#4b5467" stroke-width="1.5"/>
      <use href="#rack-fan" x="20" y="30"/><use href="#rack-fan" x="60" y="30"/><use href="#rack-fan" x="100" y="30"/><use href="#rack-fan" x="140" y="30"/>
      </g>
      <g transform="matrix(.866 .5 0 1 -138.56 -200)">
      <rect width="160" height="280" fill="#252b36"/>
      
  <circle cx="109" cy="10" r="2.5" class="led blue"/>
  <circle cx="122" cy="10" r="2.2" class="led status pulse"/>
  <circle cx="133" cy="10" r="2.2" class="led activity" style="--period: 4.8s; --delay: -1.6s"/>
  <circle cx="144" cy="10" r="2.2" class="fault"/>
      <rect x="8" y="20" width="144" height="240" rx="3" fill="#1b2029" stroke="#394151"/>
