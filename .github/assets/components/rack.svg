  </pattern>
  <radialGradient id="glow-status" r=".875" style="color: var(--_color)">
    <stop offset=".571" stop-color="currentColor" stop-opacity=".42"/>
    <stop offset=".77" stop-color="currentColor" stop-opacity=".18"/>
    <stop offset="1" stop-color="currentColor" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow-disk" r=".875" style="color: var(--_disk)">
    <stop offset=".571" stop-color="currentColor" stop-opacity=".42"/>
    <stop offset=".77" stop-color="currentColor" stop-opacity=".18"/>
    <stop offset="1" stop-color="currentColor" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow-fault" r=".875" style="color: var(--_fault)">
    <stop offset=".571" stop-color="currentColor" stop-opacity=".42"/>
    <stop offset=".77" stop-color="currentColor" stop-opacity=".18"/>
    <stop offset="1" stop-color="currentColor" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow-blue" r=".875" style="color: #38bdf8">
