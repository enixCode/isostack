      <rect transform="matrix(1 0 0 1 274 22)" width="32" height="132" fill="url(#shadow-edge)"/><rect transform="matrix(0 1 1 0 22 154)" width="32" height="252" fill="url(#shadow-edge)"/><rect transform="matrix(1 0 0 1 274 154)" width="32" height="32" fill="url(#shadow-corner)"/><rect transform="matrix(-1 0 0 1 22 154)" width="32" height="32" fill="url(#shadow-corner)"/><rect transform="matrix(1 0 0 -1 274 22)" width="32" height="32" fill="url(#shadow-corner)"/>
    </g>
    <g class="cover">
