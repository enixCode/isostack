      <rect x="10" y="10" width="260" height="140" rx="3" fill="none" stroke="#4b5467" stroke-width="1.5"/>
      </g>
      <g transform="matrix(.866 .5 0 1 -138.56 0)">
      <rect width="280" height="80" fill="#252b36"/>
      
