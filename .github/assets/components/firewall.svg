  <rect x="264" width="16" height="80" fill="#2f3644"/>
  <circle cx="8" cy="14" r="3" class="screw"/><circle cx="8" cy="66" r="3" class="screw"/><circle cx="272" cy="14" r="3" class="screw"/><circle cx="272" cy="66" r="3" class="screw"/>
      <rect x="20" y="8" width="240" height="40" fill="#93483a" stroke="#191d25" stroke-width="2"/>
