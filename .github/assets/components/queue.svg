      <rect fill="#0b1020" fill-opacity=".2" x="22" y="22" width="212" height="52"/><rect transform="matrix(1 0 0 1 234 22)" width="32" height="52" fill="url(#shadow-edge)"/><rect transform="matrix(0 1 1 0 22 74)" width="32" height="212" fill="url(#shadow-edge)"/><rect transform="matrix(1 0 0 1 234 74)" width="32" height="32" fill="url(#shadow-corner)"/><rect transform="matrix(-1 0 0 1 22 74)" width="32" height="32" fill="url(#shadow-corner)"/><rect transform="matrix(1 0 0 -1 234 22)" width="32" height="32" fill="url(#shadow-corner)"/><rect transform="matrix(-1 0 0 1 22 22)" width="32" height="52" fill="url(#shadow-edge)"/><rect transform="matrix(0 -1 1 0 22 22)" width="32" height="212" fill="url(#shadow-edge)"/><rect transform="matrix(-1 0 0 -1 22 22)" width="32" height="32" fill="url(#shadow-corner)"/>
    </g>
