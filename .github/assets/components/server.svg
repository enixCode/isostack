  <radialGradient id="glow-status" r=".875" style="color: var(--_color)">
    <stop offset=".571" stop-color="currentColor" stop-opacity=".42"/>
    <stop offset=".77" stop-color="currentColor" stop-opacity=".18"/>
    <stop offset="1" stop-color="currentColor" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow-disk" r=".875" style="color: var(--_disk)">
    <stop offset=".571" stop-color="currentColor" stop-opacity=".42"/>
    <stop offset=".77" stop-color="currentColor" stop-opacity=".18"/>
    <stop offset="1" stop-color="currentColor" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow-fault" r=".875" style="color: var(--_fault)">
    <stop offset=".571" stop-color="currentColor" stop-opacity=".42"/>
    <stop offset=".77" stop-color="currentColor" stop-opacity=".18"/>
    <stop offset="1" stop-color="currentColor" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow-blue" r=".875" style="color: #38bdf8">
    <stop offset=".571" stop-color="currentColor" stop-opacity=".42"/>
    <stop offset=".77" stop-color="currentColor" stop-opacity=".18"/>
    <stop offset="1" stop-color="currentColor" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="shadow-edge" gradientUnits="userSpaceOnUse" x2="32"><stop offset="0" stop-color="#0b1020" stop-opacity="0.2"/><stop offset="0.33" stop-color="#0b1020" stop-opacity="0.152"/><stop offset="0.67" stop-color="#0b1020" stop-opacity="0.048"/><stop offset="1" stop-color="#0b1020" stop-opacity="0"/></linearGradient>
  <radialGradient id="shadow-corner" href="#shadow-edge" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="32"/>
  <linearGradient id="halo-edge" class="halo-fade" gradientUnits="userSpaceOnUse" x2="52"><stop offset="0" stop-opacity="0.55"/><stop offset="0.25" stop-opacity="0.448"/><stop offset="0.5" stop-opacity="0.248"/><stop offset="0.75" stop-opacity="0.07"/><stop offset="1" stop-opacity="0"/></linearGradient>
  <radialGradient id="halo-corner" href="#halo-edge" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="52"/>
