<svg xmlns="http://www.w3.org/2000/svg" viewBox="-237.2 -184 509.04 468" width="509.04" height="468" data-status="ok" role="img" aria-label="Storage, status ok">
  <style>
  /* Status goes through inherited variables (--_ prefix: internal): they are the only ones that
     reach the copies made by use, such as the network ports. */
  [data-status] {
    --_color: var(--iso-ok, #22c55e); --_disk: var(--iso-ok, #22c55e); --_disk-anim: activity;
    --_fault: #3a2d18; --_fault-anim: none;
  }
  [data-status="warn"] { --_color: var(--iso-warn, #f59e0b); --_fault: var(--_color); }
  [data-status="down"] {
    --_color: var(--iso-down, #ef4444); --_fault: var(--_color); --_fault-anim: pulse;
    --_disk: #1f2a22; --_disk-anim: none;
  }
  /* Unknown: no data, so a grey status light and no disk activity. */
  [data-status="unknown"] { --_color: var(--iso-unknown, #94a3b8); --_disk: #2b313d; --_disk-anim: none; }
  /* Cover: the front faces fade out when the box is open, to show the inside. */
  .cover { transition: opacity .4s; }
  [data-open] .cover { opacity: .04; }
  /* Inside: painted only while the box is open, and through the fade that follows closing it (the
     switch to none waits for the end of the transition, where supported). */
  .inside { display: none; transition: display .4s allow-discrete; }
  [data-open] .inside { display: inline; }
  .inside rect { stroke: #2a303b; vector-effect: non-scaling-stroke; }
  .floor-grid { fill: none; stroke: #c3cad5; stroke-width: 1; vector-effect: non-scaling-stroke; }
  /* Front edges fade partly with the cover; the back ones stay sharp. */
  .edge { fill: none; stroke: #0f1218; stroke-width: 1.5; stroke-linejoin: round; vector-effect: non-scaling-stroke; transition: opacity .4s; }
  [data-open] .edge { opacity: .25; }
  /* Status halo on the ground, warn and down only, in the status color. */
  .halo { display: none; }
  [data-status="warn"] .halo, [data-status="down"] .halo { display: inline; }
  .halo-core { fill: var(--_color); }
  .halo-fade stop { stop-color: var(--_color); }
  /* Lights glow without a filter: a 2 units wide band around the dot, under its flat core, painted by
     a radial gradient of its own color (see glow below). */
  .led, .fault { stroke-width: 4; paint-order: stroke; pointer-events: none; }
  .led.blue { stroke: url(#glow-blue); }
  .led.status { stroke: url(#glow-status); }
  .led.activity { stroke: url(#glow-disk); }
  .fault { stroke: url(#glow-fault); }
  .blue { fill: #38bdf8; }
  .status { fill: var(--_color); }
  .screw { fill: #11151b; stroke: #4b5467; }
  .label { font: 700 14px ui-monospace, Consolas, monospace; fill: #1e293b; }
  /* Animations. A light is lit or dim, never half way, and every change of every light falls on one
     shared beat of .2 s, so that the browser repaints a few times a second instead of at every frame.
     --period (a whole number of 2.4 s turns; 0 keeps the light lit) and --delay (whole beats) place a
     light in the pattern; the element shifts all its lights by --_phase, so that devices of a kind do
     not blink together. --iso-speed speeds the beat up or down, --iso-animation: paused freezes it. */
  .activity { fill: var(--_disk); animation: var(--_disk-anim) calc(var(--period, 2.4s) / var(--iso-speed, 1)) calc((var(--delay, 0s) + var(--_phase, 0s)) / var(--iso-speed, 1)) step-end infinite var(--iso-animation, running); }
  .pulse { animation: pulse calc(2.4s / var(--iso-speed, 1)) calc(var(--_phase, 0s) / var(--iso-speed, 1)) step-end infinite var(--iso-animation, running); }
  .fault { fill: var(--_fault); animation: var(--_fault-anim) calc(.8s / var(--iso-speed, 1)) step-end infinite var(--iso-animation, running); }
  @keyframes activity { 0%, 25%, 66.667%, 83.333% { opacity: 1; } 16.667%, 50%, 75% { opacity: .15; } }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: .3; } }
  /* An animated light is moved to a layer of its own, which would not fade with the cover: the lights of
     an open cover stand still (the element also keeps them still through the fade that closes it). */
  [data-open] .cover .activity, [data-open] .cover .pulse, [data-open] .cover .fault { animation: none; }
  @media (prefers-reduced-motion: reduce) {
    .activity, .pulse, .fault { animation: none !important; }
    .cover, .edge, .inside { transition: none; }
  }
</style>
  <defs>
  <pattern id="perforation" width="6" height="6" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1.3" fill="#0d1015"/>
  </pattern>
  <pattern id="slots" width="8" height="10" patternUnits="userSpaceOnUse">
    <rect width="4" height="10" fill="#0d1015"/>
  </pattern>
  <radialGradient id="glow-status" r=".875" style="color: var(--_color)">
    <stop offset=".571" stop-color="currentColor" stop-opacity=".42"/>
    <stop offset=".77" stop-color="currentColor" stop-opacity=".18"/>
    <stop offset="1" stop-color="currentColor" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow-disk" r=".875" style="color: var(--_disk)">
    <stop offset=".571" stop-color="currentColor" stop-opacity=".42"/>
    <stop offset=".77" stop-color="currentColor" stop-opacity=".18"/>
    <stop offset="1" stop-color="currentColor" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow-fault" r=".875" style="color: var(--_fault)">
    <stop offset=".571" stop-color="currentColor" stop-opacity=".42"/>
    <stop offset=".77" stop-color="currentColor" stop-opacity=".18"/>
    <stop offset="1" stop-color="currentColor" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow-blue" r=".875" style="color: #38bdf8">
    <stop offset=".571" stop-color="currentColor" stop-opacity=".42"/>
    <stop offset=".77" stop-color="currentColor" stop-opacity=".18"/>
    <stop offset="1" stop-color="currentColor" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="shadow-edge" gradientUnits="userSpaceOnUse" x2="32"><stop offset="0" stop-color="#0b1020" stop-opacity="0.2"/><stop offset="0.33" stop-color="#0b1020" stop-opacity="0.152"/><stop offset="0.67" stop-color="#0b1020" stop-opacity="0.048"/><stop offset="1" stop-color="#0b1020" stop-opacity="0"/></linearGradient>
  <radialGradient id="shadow-corner" href="#shadow-edge" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="32"/>
  <linearGradient id="halo-edge" class="halo-fade" gradientUnits="userSpaceOnUse" x2="52"><stop offset="0" stop-opacity="0.55"/><stop offset="0.25" stop-opacity="0.448"/><stop offset="0.5" stop-opacity="0.248"/><stop offset="0.75" stop-opacity="0.07"/><stop offset="1" stop-opacity="0"/></linearGradient>
  <radialGradient id="halo-corner" href="#halo-edge" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="52"/>
    <g id="storage-bay">
      <rect width="30" height="88" rx="2" fill="#2a303c" stroke="#394151"/>
      <rect x="5" y="15" width="20" height="54" fill="url(#perforation)"/>
      <rect x="4" y="74" width="22" height="9" rx="2" fill="#3e6d73"/>
      <rect x="10" y="77" width="10" height="3" rx="1" fill="#0d1015"/>
    </g>
  </defs>
  <g class="drawing">
    <g class="ground" shape-rendering="crispEdges" transform="matrix(.866 .5 -.866 .5 0 0)">
      <g class="halo"><rect transform="matrix(1 0 0 1 240 0)" width="52" height="200" fill="url(#halo-edge)"/><rect transform="matrix(0 1 1 0 0 200)" width="52" height="240" fill="url(#halo-edge)"/><rect transform="matrix(1 0 0 1 240 200)" width="52" height="52" fill="url(#halo-corner)"/><rect transform="matrix(-1 0 0 1 0 200)" width="52" height="52" fill="url(#halo-corner)"/><rect transform="matrix(1 0 0 -1 240 0)" width="52" height="52" fill="url(#halo-corner)"/><rect transform="matrix(-1 0 0 1 0 0)" width="52" height="200" fill="url(#halo-edge)"/><rect transform="matrix(0 -1 1 0 0 0)" width="52" height="240" fill="url(#halo-edge)"/><rect transform="matrix(-1 0 0 -1 0 0)" width="52" height="52" fill="url(#halo-corner)"/></g>
      <rect transform="matrix(1 0 0 1 234 22)" width="32" height="172" fill="url(#shadow-edge)"/><rect transform="matrix(0 1 1 0 22 194)" width="32" height="212" fill="url(#shadow-edge)"/><rect transform="matrix(1 0 0 1 234 194)" width="32" height="32" fill="url(#shadow-corner)"/><rect transform="matrix(-1 0 0 1 22 194)" width="32" height="32" fill="url(#shadow-corner)"/><rect transform="matrix(1 0 0 -1 234 22)" width="32" height="32" fill="url(#shadow-corner)"/>
    </g>
    <g class="cover">
      <g transform="matrix(.866 .5 -.866 .5 0 -120)">
      <rect width="240" height="200" fill="#3b4352"/>
      <rect x="10" y="10" width="220" height="180" rx="3" fill="none" stroke="#4b5467" stroke-width="1.5"/>
      <rect x="24" y="22" width="192" height="16" fill="url(#perforation)"/>
      </g>
      <g transform="matrix(.866 .5 0 1 -173.2 -20)">
      <rect width="240" height="120" fill="#252b36"/>
      <rect x="2" y="11" width="198" height="98" rx="3" fill="#13161c"/>
      <use href="#storage-bay" x="6" y="16"/>
        <circle cx="15" cy="24" r="2" class="led activity" style="--period: 2.4s; --delay: -0.0s"/><circle cx="27" cy="24" r="2" class="fault"/><use href="#storage-bay" x="46" y="16"/>
        <circle cx="55" cy="24" r="2" class="led activity" style="--period: 0s"/><circle cx="67" cy="24" r="2" class="fault"/><use href="#storage-bay" x="86" y="16"/>
        <circle cx="95" cy="24" r="2" class="led activity" style="--period: 4.8s; --delay: -0.4s"/><circle cx="107" cy="24" r="2" class="fault"/><use href="#storage-bay" x="126" y="16"/>
        <circle cx="135" cy="24" r="2" class="led activity" style="--period: 0s"/><circle cx="147" cy="24" r="2" class="fault"/><use href="#storage-bay" x="166" y="16"/>
        <circle cx="175" cy="24" r="2" class="led activity" style="--period: 7.2s; --delay: -0.8s"/><circle cx="187" cy="24" r="2" class="fault"/>
      
  <circle cx="220" cy="25" r="6" fill="#191d25" stroke="#4b5467"/>
  <circle cx="220" cy="25" r="2.5" class="led blue"/>
  <circle cx="220" cy="43" r="2.2" class="led status pulse"/>
  <circle cx="220" cy="53" r="2.2" class="led activity" style="--period: 4.8s; --delay: -1.6s"/>
  <circle cx="220" cy="63" r="2.2" class="fault"/>
  <rect x="215" y="72" width="10" height="5" rx="1" fill="#0d1015" stroke="#4b5467"/>
      <rect x="213" y="88" width="14" height="6" rx="1" fill="#0d1015" stroke="#4b5467"/>
      <rect y="114" width="240" height="6" fill="#1b2029"/></g>
      <g transform="matrix(.866 -.5 0 1 34.64 100)">
      <rect width="200" height="120" fill="#1d222b"/>
      <rect x="10" y="16" width="20" height="80" fill="url(#slots)"/><rect x="50" y="16" width="20" height="80" fill="url(#slots)"/><rect x="90" y="16" width="20" height="80" fill="url(#slots)"/><rect x="130" y="16" width="20" height="80" fill="url(#slots)"/><rect x="170" y="16" width="20" height="80" fill="url(#slots)"/>
      <rect y="114" width="200" height="6" fill="#171b22"/></g>
    </g>
    <!-- Visible edges, always drawn. -->
    <rect class="edge" transform="matrix(.866 .5 -.866 .5 0 -120)" width="240" height="200"/>
    <rect class="edge" transform="matrix(.866 .5 0 1 -173.2 -20)" width="240" height="120"/>
    <rect class="edge" transform="matrix(.866 -.5 0 1 34.64 100)" width="200" height="120"/></g>
</svg>