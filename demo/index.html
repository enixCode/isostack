<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>isostack demo</title>
<!-- ES modules: serve this page over http (for instance python -m http.server), not by double-click. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #eef1f5; font: 13px system-ui, sans-serif; color: #334155; }
  #view { position: fixed; inset: 0; overflow: hidden; touch-action: none; user-select: none; cursor: grab; }
  #view:active { cursor: grabbing; }
  /* The grid and the elements: the same pan and zoom for both, under one transform (see apply()). While
     the view moves, the world becomes a layer of its own, painted once: moving the view only moves a texture. */
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #floor { position: absolute; left: -20000px; top: -20000px; width: 40000px; height: 40000px; pointer-events: none; }
  #layer { position: absolute; left: 0; top: 0; }
  /* While the view moves (see stir()), the world is promoted and nothing animates, so that no light repaints under it. */
  #view.busy #world { will-change: transform; }
  #view.busy #layer { --iso-animation: paused; }
  /* Each element stands on the page grid at its own x, z cells, which it publishes itself, back to front. */
  #layer > * {
    position: absolute; left: 0; top: 0; z-index: var(--iso-order);
    translate: calc(var(--iso-offset-x) - var(--iso-anchor-x)) calc(var(--iso-offset-y) - var(--iso-anchor-y));
  }
  /* The selected element glows; it also shows its blue cubes (see select()). */
  [data-selected] { filter: drop-shadow(0 0 8px #3b82f6); }
  #tools { position: fixed; left: 16px; top: 12px; max-width: calc(100% - 360px); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #tools button { font: inherit; padding: 4px 10px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; cursor: pointer; }
  #tools input[type="number"] { width: 3.5em; font: inherit; }
  #log { position: fixed; right: 16px; top: 12px; margin: 0; font: 12px ui-monospace, Consolas, monospace; color: #475569; text-align: right; pointer-events: none; }
  #help { position: fixed; left: 16px; bottom: 12px; color: #64748b; pointer-events: none; }
</style>
</head>
<body>
<main id="view">
  <div id="world">
    <svg id="floor" viewBox="-20000 -20000 40000 40000">
      <defs>
        <!-- Isometric grid: one cell = 40 units on the ground. -->
        <pattern id="grid" width="69.28" height="40" patternUnits="userSpaceOnUse">
          <path d="M0 0L69.28 40M69.28 0L0 40" stroke="#d5dbe4" stroke-width=".8"/>
        </pattern>
      </defs>
      <rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#grid)"/>
    </svg>
    <div id="layer">
      <!-- Row 0: people, devices and the internet. -->
      <iso-user data-row="0" label="alice"></iso-user>
      <iso-laptop data-row="0" label="laptop"></iso-laptop>
      <iso-phone data-row="0"></iso-phone>
      <iso-desktop data-row="0" label="desk"></iso-desktop>
      <iso-cloud data-row="0" label="internet"></iso-cloud>
      <iso-dns data-row="0" label="dns"></iso-dns>
      <!-- Row 1: network. -->
      <iso-firewall data-row="1" label="fw-01"></iso-firewall>
      <iso-router data-row="1" label="gw-01"></iso-router>
      <iso-load-balancer data-row="1" label="lb-01"></iso-load-balancer>
      <iso-switch data-row="1" label="sw-01"></iso-switch>
      <!-- Row 2: compute, with boxes in boxes (zoom in to open them). -->
      <iso-server data-row="2" label="srv-01"></iso-server>
      <iso-vps data-row="2" width="10" depth="7" height="4" label="vps-01">
        <iso-docker x="1" z="1" width="8" depth="5" height="3" label="stack">
          <iso-app x="1" z="1.5" label="web"></iso-app>
          <iso-app x="4.5" z="1.5" label="api" status="warn"></iso-app>
        </iso-docker>
      </iso-vps>
      <iso-vm data-row="2" width="6" depth="5" label="vm-01">
        <iso-app x="2" z="1.5" label="worker"></iso-app>
      </iso-vm>
      <iso-rack data-row="2" width="5" depth="5" height="7" label="rack-a">
        <iso-server x=".5" y=".3" z=".5" width="4" depth="4"></iso-server>
        <iso-server x=".5" y="3.1" z=".5" width="4" depth="4" status="down"></iso-server>
      </iso-rack>
      <!-- Row 3: data, storage and the homelab. -->
      <iso-db data-row="3" label="pg"></iso-db>
      <iso-cache data-row="3" label="cache"></iso-cache>
      <iso-queue data-row="3" label="jobs"></iso-queue>
      <iso-bucket data-row="3" label="assets"></iso-bucket>
      <iso-storage data-row="3" label="nas"></iso-storage>
      <iso-raspberry-pi data-row="3" label="pi"></iso-raspberry-pi>
    </div>
  </div>
</main>
<div id="tools">
  Status:
  <button data-status="ok">ok</button>
  <button data-status="warn">warn</button>
  <button data-status="down">down</button>
  <button data-status="unknown">unknown</button>
  <!-- Resizing without the cubes: a host UI only has to set attributes. -->
  <label>Width <input id="width" type="number" min="1" max="30"></label>
  <label>Depth <input id="depth" type="number" min="1" max="30"></label>
  <label>Height <input id="height" type="number" min=".5" max="12" step=".5"></label>
  <label>Speed <input id="speed" type="range" min=".25" max="4" step=".25" value="1"></label>
</div>
<pre id="log"></pre>
<div id="help">Click: select, its blue cubes appear · Drag: pan · Wheel: zoom (containers open past ×1.6) · Drag a blue cube: resize</div>
<script type="module">
import { IsoBox } from '../index.js';

const view = document.getElementById('view'), world = document.getElementById('world'), layer = document.getElementById('layer');
const elements = [...layer.querySelectorAll('*')].filter(el => el instanceof IsoBox);
// View: offset (x, y) in pixels and zoom z.
let x = 0, y = 0, z = 1, pan = null, selected = null;

// Lay the top-level elements out on the page grid, row by row: along x within a row, rows one behind the other.
function layout() {
  let depth = 0;
  for (const row of ['0', '1', '2', '3']) {
    let cursor = 0, deepest = 0;
    for (const el of layer.querySelectorAll(`:scope > [data-row="${row}"]`)) {
      el.x = cursor;
      el.z = depth;
      cursor += el.width + 3;
      deepest = Math.max(deepest, el.depth);
    }
    depth += deepest + 5;
  }
}

// Moving the view. Input can come faster than frames, so it only changes x, y, z and asks for a frame:
// one transform is written per frame, whatever the number of events.
let queued = 0;
function update() {
  stir();
  queued ||= requestAnimationFrame(apply);
}
function apply() {
  queued = 0;
  world.style.transform = `translate(${x}px, ${y}px) scale(${z})`;
  // Past ×1.6 the page opens every container; each one fades its own cover.
  for (const el of elements) if (el.constructor.model.container) el.open = z > 1.6;
}

// The view is moving: the world is promoted and the animations paused (see the CSS) until it has
// rested for 150 ms. A frame loop watches for the rest, so that a long frame cannot end the movement
// before the input waiting behind it is read. Dropping the promotion then paints the page once more,
// sharp at the final zoom.
let stirred = 0;
function stir() {
  stirred = performance.now();
  if (view.classList.contains('busy')) return;
  view.classList.add('busy');
  const watch = now => now - stirred > 150 ? view.classList.remove('busy') : requestAnimationFrame(watch);
  requestAnimationFrame(watch);
}

// Fit the whole scene in the window.
function fit() {
  x = 0; y = 0; z = 1;
  apply();
  const boxes = [...layer.children].map(el => el.getBoundingClientRect());
  const left = Math.min(...boxes.map(b => b.left)), top = Math.min(...boxes.map(b => b.top));
  const right = Math.max(...boxes.map(b => b.right)), bottom = Math.max(...boxes.map(b => b.bottom));
  z = Math.min((innerWidth - 60) / (right - left), (innerHeight - 140) / (bottom - top), 1.2);
  x = (innerWidth - (right - left) * z) / 2 - left * z;
  y = (innerHeight - (bottom - top) * z) / 2 + 20 - top * z;
  apply();
}

// Selecting an element shows its blue cubes and loads its size in the toolbar.
function select(el) {
  if (selected) {
    selected.removeAttribute('data-selected');
    selected.resizable = false;
  }
  selected = el;
  if (!el) return;
  el.setAttribute('data-selected', '');
  el.resizable = true;
  for (const name of ['width', 'depth', 'height']) document.getElementById(name).value = el[name];
}

view.addEventListener('pointerdown', e => pan = { dx: e.clientX - x, dy: e.clientY - y, x: e.clientX, y: e.clientY, moved: false });
view.addEventListener('pointermove', e => {
  if (!pan) return;
  // Capture the pointer only once the drag has started: otherwise the click would go to the page
  // instead of the element.
  if (!view.hasPointerCapture(e.pointerId)) {
    if (Math.hypot(e.clientX - pan.x, e.clientY - pan.y) < 4) return;
    view.setPointerCapture(e.pointerId);
    pan.moved = true;
  }
  x = e.clientX - pan.dx;
  y = e.clientY - pan.dy;
  update();
});
for (const type of ['pointerup', 'pointercancel']) addEventListener(type, () => setTimeout(() => pan = null));
view.addEventListener('click', e => { if (!pan?.moved) select(e.target instanceof IsoBox ? e.target : null); });
// Wheel: zoom centered on the mouse.
view.addEventListener('wheel', e => {
  e.preventDefault();
  const k = Math.min(6, Math.max(0.2, z * Math.exp(-e.deltaY * 0.0015))) / z;
  x = e.clientX - (e.clientX - x) * k;
  y = e.clientY - (e.clientY - y) * k;
  z *= k;
  update();
}, { passive: false });

// Toolbar: status and size of the selected element through attributes, animation speed through a CSS variable.
for (const button of document.querySelectorAll('[data-status]')) button.addEventListener('click', () => selected?.setAttribute('status', button.dataset.status));
for (const name of ['width', 'depth', 'height']) {
  const input = document.getElementById(name);
  input.addEventListener('input', () => selected?.setAttribute(name, input.value));
}
document.addEventListener('input', e => {
  // The cubes change the size too: keep the toolbar in sync.
  if (e.target === selected) for (const name of ['width', 'depth', 'height']) document.getElementById(name).value = selected[name];
});
document.getElementById('speed').addEventListener('input', e => layer.style.setProperty('--iso-speed', e.target.value));

// Log of the standard events fired by the elements: one listener for all of them.
const log = document.getElementById('log'), lines = [];
for (const type of ['click', 'input', 'change']) {
  document.addEventListener(type, e => {
    if (!(e.target instanceof IsoBox)) return;
    const el = e.target;
    lines.unshift(`${type}: ${el.localName} ${el.label}, ${el.width} × ${el.depth} cells, ${el.status}`);
    lines.length = Math.min(lines.length, 8);
    log.textContent = lines.join('\n');
  });
}

layout();
fit();
</script>
</body>
</html>
